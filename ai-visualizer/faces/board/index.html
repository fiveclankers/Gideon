<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GIDEON PRIME</title>
<style>
:root{--void:#020609;--em:61,220,132;--cu:231,195,104;--cy:0,240,255;--am:255,183,77;--ink:226,238,240;--acc:61,220,132;
--mono:"SF Mono",Menlo,Consolas,monospace;--sans:"Inter","Segoe UI",system-ui,sans-serif;color-scheme:dark;box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;background:var(--void);overflow:hidden;color:rgb(var(--ink));font-family:var(--sans)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;font-family:var(--mono);transition:opacity .6s}
.cn{position:absolute;width:30px;height:30px;border:1px solid rgba(var(--em),.28)}
.tl{top:calc(14px + env(safe-area-inset-top,0px));left:14px;border-right:0;border-bottom:0}.tr{top:calc(14px + env(safe-area-inset-top,0px));right:14px;border-left:0;border-bottom:0}
.bl{bottom:calc(14px + env(safe-area-inset-bottom,0px));left:14px;border-right:0;border-top:0}.br{bottom:calc(14px + env(safe-area-inset-bottom,0px));right:14px;border-left:0;border-top:0}
#brand{position:absolute;top:calc(30px + env(safe-area-inset-top,0px));left:44px}
#brand b{display:block;font-weight:400;font-size:clamp(12px,1.05vw,20px);letter-spacing:.5em;text-shadow:0 0 14px rgba(var(--em),.45)}
#brand span{display:block;margin-top:7px;font-size:clamp(8px,.6vw,11px);letter-spacing:.3em;color:rgba(var(--ink),.45)}
#brand em{font-style:normal;color:rgb(var(--em))}
#top{position:absolute;top:calc(30px + env(safe-area-inset-top,0px));right:44px;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#mode{display:flex;align-items:center;gap:9px;font-size:clamp(11px,.9vw,17px);letter-spacing:.42em;color:rgb(var(--acc))}
#mode i{width:8px;height:8px;border-radius:50%;background:rgb(var(--acc));box-shadow:0 0 12px rgb(var(--acc));animation:br 1.6s ease-in-out infinite}
#tbadge{font-size:clamp(8px,.62vw,11px);letter-spacing:.2em;padding:5px 10px;border:1px solid rgba(255,255,255,.08);border-radius:999px;color:rgba(var(--ink),.4);max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tbadge.on{color:rgb(var(--am));border-color:rgba(var(--am),.4);background:rgba(var(--am),.07)}
#clk{font-size:clamp(8px,.6vw,11px);letter-spacing:.25em;color:rgba(var(--cu),.75)}
@keyframes br{50%{opacity:.35}}
#tx{position:absolute;left:44px;bottom:calc(34px + env(safe-area-inset-bottom,0px));max-width:min(40vw,560px);transition:opacity 1s;text-shadow:0 0 12px #000}
#tx.off{opacity:0}
#u{font-family:var(--mono);font-size:clamp(10px,.78vw,14px);letter-spacing:.14em;color:rgba(var(--cy),.85);margin-bottom:8px}
#u.live::after{content:"";display:inline-block;width:.5em;height:1em;margin-left:4px;background:currentColor;vertical-align:-.15em;animation:br .9s steps(2,start) infinite}
#r{font-size:clamp(14px,1.2vw,22px);line-height:1.45;font-weight:300;color:rgba(var(--ink),.95)}
.g{background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.012)),rgba(4,10,12,.62);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);
border:1px solid rgba(255,255,255,.08);border-radius:18px;box-shadow:0 14px 44px rgba(0,0,0,.5),inset 0 0 40px rgba(var(--acc),.05)}
#jv{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 28px));display:flex;flex-direction:column;gap:10px;z-index:5}
#jv [hidden]{display:none!important}
#ask{padding:16px;border-color:rgba(var(--am),.45);background:linear-gradient(160deg,rgba(var(--am),.14),rgba(var(--am),.03)),rgba(14,9,2,.7);box-shadow:0 0 0 1px rgba(var(--am),.12),0 18px 50px rgba(0,0,0,.6),0 0 44px rgba(var(--am),.14);animation:rise .35s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}}
.ah{display:flex;align-items:center;gap:10px}.ah i{width:7px;height:7px;border-radius:50%;background:rgb(var(--am));box-shadow:0 0 12px rgb(var(--am));animation:br 1.1s infinite}
#at{flex:1;font-size:15px;letter-spacing:.02em}#ac{font:11px var(--mono);color:rgba(var(--am),.85)}
#ab{margin-top:8px;font-size:13px;line-height:1.5;color:rgba(var(--ink),.7);overflow-wrap:anywhere}
#ak{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.06);font:12px/1.55 var(--mono);color:rgba(var(--ink),.88);white-space:pre-wrap;overflow-wrap:anywhere;max-height:140px;overflow:auto}
#aa{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.bt{flex:1;min-width:88px;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:rgb(var(--ink));font:inherit;font-size:13px;cursor:pointer;transition:background .2s,border-color .2s}
.bt:hover{background:rgba(255,255,255,.09)}.bt.p{color:rgb(var(--am));border-color:rgba(var(--am),.55);background:rgba(var(--am),.13)}.bt.p:hover{background:rgba(var(--am),.24)}
#task{border-radius:16px}#tr{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:11px;width:100%;padding:11px 14px 11px 16px;font-size:12.5px;letter-spacing:.03em;cursor:pointer}
#tr i{flex:none;width:6px;height:6px;border-radius:50%;background:rgba(var(--ink),.4)}#task[data-a="1"] #tr i{background:rgb(var(--cy));box-shadow:0 0 10px rgb(var(--cy));animation:br 1.2s infinite}
#ts{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#tt{font:11px var(--mono);color:rgba(var(--ink),.5)}
#tb{padding:0 16px 14px 33px;font-size:12px;color:rgba(var(--ink),.6)}#tb li{list-style:none;padding:2px 0;display:flex;gap:9px}#tb li::before{content:"";width:5px;height:5px;margin-top:6px;border-radius:50%;background:rgb(var(--em));flex:none}
#form{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 16px;border-radius:22px;transition:border-color .3s,box-shadow .3s}
#form:focus-within{border-color:rgba(var(--acc),.5);box-shadow:0 12px 40px rgba(0,0,0,.45),0 0 0 4px rgba(var(--acc),.08)}
#form.hot{border-color:rgba(var(--cy),.7)}
#inp{flex:1;min-width:0;background:none;border:0;outline:0;color:rgb(var(--ink));font:inherit;font-size:14px;padding:9px 0}#inp::placeholder{color:rgba(var(--ink),.34)}
.ic{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:rgba(var(--ink),.55);cursor:pointer;transition:.25s}
.ic:hover{color:rgb(var(--ink));background:rgba(255,255,255,.07)}.ic[aria-pressed=true]{color:rgb(var(--cy));background:rgba(var(--cy),.13)}.ic svg{width:18px;height:18px}
#send{color:rgba(var(--ink),.25);pointer-events:none}#form[data-r="1"] #send{color:#021014;background:rgb(var(--acc));pointer-events:auto;box-shadow:0 0 18px rgba(var(--acc),.4)}
#meta{display:flex;align-items:center;gap:6px;padding:0 4px;min-height:26px;font-size:10.5px}
.ch{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.09);background:none;color:rgba(var(--ink),.55);font:10px var(--mono);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.ch:hover{color:rgb(var(--ink))}.ch[aria-pressed=true]{border-color:rgba(var(--em),.4);color:rgb(var(--em))}.ch s{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
#eff b{display:inline-flex;gap:2px;align-items:flex-end;height:10px}#eff b i{width:3px;background:rgba(var(--ink),.22);border-radius:1px}#eff b i:nth-child(1){height:4px}#eff b i:nth-child(2){height:7px}#eff b i:nth-child(3){height:10px}
#eff[data-l="1"] i:nth-child(-n+1),#eff[data-l="2"] i:nth-child(-n+2),#eff[data-l="3"] i{background:rgb(var(--cy))}
#st{margin-left:auto;font:10px var(--mono);letter-spacing:.14em;color:rgba(var(--ink),.4);text-transform:uppercase;white-space:nowrap}
@media(max-width:760px){#jv{right:14px;left:14px;width:auto}#tx{left:20px;max-width:calc(100vw - 40px);bottom:calc(168px + env(safe-area-inset-bottom,0px))}#brand{left:30px}#top{right:30px}.sp{display:none}}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><i class="cn tl"></i><i class="cn tr"></i><i class="cn bl"></i><i class="cn br"></i>
<div id="brand"><b>GIDEON PRIME</b><span>NEURAL LINK · <em id="link">STANDALONE</em></span></div>
<div id="top"><div id="mode"><i></i><span id="ms">IDLE</span></div><div id="tbadge">NO ACTIVE TOOL</div><div id="clk">--:--:--</div></div>
<div id="tx" class="off"><p id="u"></p><p id="r"></p></div></div>
<div id="jv" role="region" aria-label="Gideon controls">

<section id="task" class="g" data-a="0" hidden><button id="tr" type="button" aria-expanded="false"><i></i><span id="ts">Working</span><span id="tt">00:00</span></button>
<div id="tb" hidden><ol id="steps"></ol></div></section>
<form id="form" class="g" data-r="0" autocomplete="off"><input id="inp" placeholder="Ask Gideon, or hold Space to talk" aria-label="Message" spellcheck="false">
<button id="mic" class="ic" type="button" aria-pressed="false" aria-label="Microphone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
<button id="send" class="ic" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg></button></form>
<div id="meta"><button id="wake" class="ch" type="button" aria-pressed="true"><s></s>Wake</button><button id="eff" class="ch" type="button" data-l="1"><b><i></i><i></i><i></i></b><span id="el">Low</span></button><button id="to-orb" class="ch" type="button" title="Switch back to Desktop Orb"><s></s>Orb</button><span id="st">Standby</span></div></div>
<script>
(()=>{'use strict';
const TAU=Math.PI*2,NB=32,PK=8,$=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x,sm=(c,t,r,dt)=>c+(t-c)*(1-Math.exp(-r*dt));
const P=new URLSearchParams(location.search),local=/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const cfg={ws:P.get('ws')||window.JARVIS_WS||'',poll:P.get('poll')||(local&&!P.get('ws')?'1':''),sens:1,particles:1800,fade:3800};
if(cfg.poll==='1')cfg.poll='/state';
const EM=[61,220,132],CY=[0,240,255],CU=[231,195,104],AM=[255,183,77];
const STATES={
idle:{r:1,noise:.04,rot:.1,ring:.25,k:48,c:6,swirl:0,core:.3,col:EM,col2:CY,col3:CU,label:'Standby'},
listening:{r:1.03,noise:.05,rot:.16,ring:.65,k:56,c:6,swirl:0,core:.55,col:CY,col2:EM,col3:[170,255,236],label:'Listening'},
thinking:{r:.84,noise:.085,rot:.95,ring:1,k:62,c:7,swirl:1,core:.75,col:CU,col2:CY,col3:AM,label:'Thinking'},
speaking:{r:1.05,noise:.06,rot:.18,ring:.85,k:64,c:5.4,swirl:0,core:.65,col:EM,col2:CY,col3:CU,label:'Speaking'}};
const cur=JSON.parse(JSON.stringify(STATES.idle));
const MODECOL={idle:'61,220,132',listening:'0,240,255',thinking:'231,195,104',speaking:'61,220,132'};

/* ---------- audio: mic + output meters -> 32 bands ---------- */
let actx;const ac=()=>{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume().catch(()=>{});return actx};
class Meter{constructor(){this.an=null;this.src=null;this.b=new Float32Array(NB);this.level=0}
attach(n){this.detach();const a=ac(),an=a.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=.5;n.connect(an);this.an=an;this.src=n;
this.fd=new Uint8Array(an.frequencyBinCount);this.td=new Uint8Array(an.fftSize);const bw=a.sampleRate/an.fftSize;this.lo=[];this.hi=[];
for(let k=0;k<NB;k++){const f0=70*Math.pow(128,k/NB),f1=70*Math.pow(128,(k+1)/NB),l=Math.max(1,Math.floor(f0/bw));this.lo[k]=l;this.hi[k]=Math.min(this.fd.length,Math.max(l+1,Math.ceil(f1/bw)))}}
detach(){try{this.src&&this.an&&this.src.disconnect(this.an)}catch(e){}this.an=this.src=null}
update(dt){const B=this.b;if(!this.an){for(let k=0;k<NB;k++)B[k]=sm(B[k],0,7,dt);this.level=sm(this.level,0,7,dt);return}
this.an.getByteFrequencyData(this.fd);this.an.getByteTimeDomainData(this.td);let s=0;for(let i=0;i<this.td.length;i++){const x=(this.td[i]-128)/128;s+=x*x}
const rms=Math.sqrt(s/this.td.length),gf=Math.pow(10,-32/20),gate=clamp((rms-gf)/.035);
for(let k=0;k<NB;k++){let sum=0,mx=0;for(let b=this.lo[k];b<this.hi[k];b++){const v=this.fd[b];sum+=v;if(v>mx)mx=v}
let v=(sum/(this.hi[k]-this.lo[k])*.5+mx*.5)/255;v*=1+k/NB*1.8;v=clamp((v-.12)/.5*cfg.sens)*gate;B[k]=v>B[k]?sm(B[k],v,30,dt):sm(B[k],v,7,dt)}
const l=clamp((rms-gf)/.1*cfg.sens)*gate;this.level=l>this.level?sm(this.level,l,30,dt):sm(this.level,l,7,dt)}}
const micM=new Meter(),outM=new Meter();
function synth(L,t,o){for(let k=0;k<NB;k++){const n=.5+.5*Math.sin(k*1.9+t*8.7+Math.sin(t*3.3+k*.7)*2),tl=Math.exp(-Math.pow((k-9)/13,2));o[k]=clamp(L*(.35+.9*n)*(.4+.9*tl))}}
let micStream=null,micOn=false,pttHeld=false;
async function mic(on=true){if(on===micOn)return micOn;
if(on){try{micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:false}});micM.attach(ac().createMediaStreamSource(micStream));micOn=true}
catch(e){$('st').textContent='Mic blocked';emit({event:'mic',on:false,error:String(e&&e.name||e)});return false}}
else{micStream&&micStream.getTracks().forEach(t=>t.stop());micStream=null;micM.detach();micOn=false}
$('mic').setAttribute('aria-pressed',micOn);$('form').classList.toggle('hot',micOn);emit({event:'mic',on:micOn});return micOn}
function earcon(kind='wake'){try{const a=ac(),n=a.currentTime,o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);
const f={wake:[520,780,.24],done:[760,510,.18],alert:[440,330,.2]}[kind]||[520,780,.2];o.type=kind==='alert'?'triangle':'sine';
o.frequency.setValueAtTime(f[0],n);o.frequency.exponentialRampToValueAtTime(f[1],n+.1);g.gain.setValueAtTime(.001,n);g.gain.exponentialRampToValueAtTime(f[2],n+.02);g.gain.exponentialRampToValueAtTime(.0001,n+.22);o.start(n);o.stop(n+.23);pulse(.5)}catch(e){}}

/* ---------- state, transcript, bus ---------- */
let state='idle',bridge=false,lastTx=0,uF='',rF='',T=0;
const ext={level:0,target:0,t:-1e9,bands:null,bt:-1e9},sim={kick:0,level:0},listeners={};
const extB=new Float32Array(NB),simB=new Float32Array(NB),drive={b:new Float32Array(NB),level:0};
function setState(s){if(!STATES[s]||s===state)return;state=s;if(s==='thinking'||s==='speaking')addWave(.45);
$('ms').textContent=s.toUpperCase();$('st').textContent=STATES[s].label;document.documentElement.style.setProperty('--acc',MODECOL[s]);emit({event:'state',value:s})}
function touch(){lastTx=performance.now();$('tx').classList.remove('off')}
let streamTarget='',streamDisp='',streamTimer=null;
function stepStream(){
  if(streamDisp.length<streamTarget.length){
    if(!streamTarget.startsWith(streamDisp)){streamDisp=''}
    const diff=streamTarget.length-streamDisp.length;
    const step=diff>70?4:(diff>30?2:1);
    const chunk=streamTarget.slice(streamDisp.length,streamDisp.length+step);
    streamDisp+=chunk;
    $('r').textContent=streamDisp;
    rF=streamDisp;
    touch();
    if(/[\s.,!?;:]/.test(chunk))sim.kick=1;
    const delay=diff>35?12:22;
    streamTimer=setTimeout(stepStream,delay);
  }else{streamTimer=null}
}
function setReplyStream(text,instant=false){
  text=String(text||'');
  streamTarget=text;
  if(!text){
    streamDisp='';rF='';$('r').textContent='';
    if(streamTimer){clearTimeout(streamTimer);streamTimer=null}
    return;
  }
  if(instant){
    streamDisp=text;rF=text;$('r').textContent=text;
    sim.kick=1;touch();
    if(streamTimer){clearTimeout(streamTimer);streamTimer=null}
    return;
  }
  if(!streamTimer)stepStream();
}
function user(t='',f=true){
  uF=String(t);$('u').textContent=uF?'> '+uF:'';$('u').classList.toggle('live',!f);
  if(uF){setReplyStream('')}
  touch();
}
function reply(t='',a=false){
  t=String(t);
  const next=a?(streamTarget&&!streamTarget.endsWith(' ')&&!t.startsWith(' ')?streamTarget+' '+t:streamTarget+t):t;
  setReplyStream(next,false);
}
function clear(){
  uF='';$('u').textContent='';setReplyStream('');$('tx').classList.add('off');
}
function setLevel(v){ext.target=clamp(+v||0);ext.t=performance.now()}
function setBands(a){if(!a||!a.length)return;const o=new Float32Array(NB);for(let k=0;k<NB;k++)o[k]=clamp(+a[Math.min(a.length-1,Math.floor(k/NB*a.length))]||0);ext.bands=o;ext.bt=ext.t=performance.now();ext.target=Math.max(...o)*.8}
function emit(m){m.t=Date.now();window.dispatchEvent(new CustomEvent('jarvis:event',{detail:m}));(listeners[m.event]||[]).forEach(f=>{try{f(m)}catch(e){}});
if(ws&&ws.readyState===1){try{ws.send(JSON.stringify(m))}catch(e){}}if(window.parent!==window){try{window.parent.postMessage(Object.assign({source:'jarvis'},m),'*')}catch(e){}}}

/* ---------- tools -> task pill + badge ---------- */
const running=new Map();let done=[],t0=0,hideT=0,lastFail=false;
function tool(m){const id=String(m.id||m.name||'tool'),label=String(m.label||m.text||id),st=m.status||'running';
if(st==='running'){if(!running.size)t0=Date.now();running.set(id,{label,target:m.target||'system'});pulse(.18)}
else{const o=running.get(id);running.delete(id);lastFail=st==='error';done.push((o?o.label:label)+(lastFail?' (failed)':''));done=done.slice(-5);pulse(.35)}renderTask()}
function renderTask(){const a=running.size>0,last=a?[...running.values()].pop():null,tk=$('task');tk.hidden=false;tk.dataset.a=a?1:0;
$('ts').textContent=a?last.label:lastFail?'Task failed':'Task complete';const b=$('tbadge');b.classList.toggle('on',a);b.textContent=a?(last.target+' · '+last.label).toUpperCase():'NO ACTIVE TOOL';
const ol=$('steps');ol.replaceChildren();done.forEach(s=>{const li=document.createElement('li');li.textContent=s;ol.appendChild(li)});
clearTimeout(hideT);if(!a)hideT=setTimeout(()=>{if($('tr').getAttribute('aria-expanded')!=='true')tk.hidden=true},6000);tick()}
function tick(){const s=running.size?Math.floor((Date.now()-t0)/1000):0;$('tt').textContent=String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
$('tr').addEventListener('click',()=>{const o=$('tr').getAttribute('aria-expanded')!=='true';$('tr').setAttribute('aria-expanded',o);$('tb').hidden=!o});
setInterval(tick,1000);

/* approvals removed per specification */
const asks=[];
function ask(){}
function renderAsk(){}
function decide(){}

/* ---------- board: radial PCB traces terminating in the orb's socket ring ---------- */
const cv=$('c'),ctx=cv.getContext('2d');let W=0,H=0,dpr=1,R=150,cx=0,cy=0,bg=null,traces=[],comps=[],pulses=[],shocks=[];
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

let demoOn=0;const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function demo(on=true){const my=++demoOn*(on?1:0);if(!on){demoOn=0;return}demoOn=my;const alive=()=>demoOn===my,say=async(txt,fn,ms)=>{const w=txt.split(' ');for(let i=1;i<=w.length&&alive();i++){fn(w.slice(0,i).join(' '));sim.kick=1;await wait(ms)}};
const lev=setInterval(()=>{if(!alive())return clearInterval(lev);if(state==='listening')setLevel(.25+.5*Math.random()*(.5+.5*Math.sin(T*6)))},60);
while(alive()){setState('idle');await wait(3000);if(!alive())break;setState('listening');await say('Pull up last night’s build logs and flag anything red',t=>user(t,false),170);if(!alive())break;
user('Pull up last night’s build logs and flag anything red',true);await wait(400);setState('thinking');tool({id:'d1',target:'shell',label:'reading build logs',status:'running'});await wait(1600);if(!alive())break;
tool({id:'d1',target:'shell',label:'reading build logs',status:'done'});ask({id:'dm'+Date.now(),title:'Run this command?',detail:'Jarvis wants to re-run the failing job.',code:'npm run build -- --only=core'});await wait(3200);if(!alive())break;
setState('speaking');await say('Two failures, both in the core package. I have queued a re-run and it needs your approval.',t=>reply(t),210);await wait(800);if(!alive())break;setState('idle');await wait(4800)}clearInterval(lev)}

mic,demo,send:handle,event:(n,d={})=>emit(Object.assign({},d,{event:n})),on(ev,fn){(listeners[ev]=listeners[ev]||[]).push(fn);return()=>{listeners[ev]=listeners[ev].filter(f=>f!==fn)}},

const inp=$('inp'),EFF=[['low','Low'],['medium','Med'],['high','High']];let ei=0;try{ei=Math.max(0,EFF.findIndex(e=>e[0]===localStorage.getItem('jv-effort')))}catch(e){}

$('eff').onclick=async()=>{ei=(ei+1)%3;rEff();try{localStorage.setItem('jv-effort',EFF[ei][0])}catch(e){}try{await fetch('/api/effort',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({effort:EFF[ei][0]})})}catch(err){console.error('Effort error:',err)}};
$('wake').onclick=async()=>{const o=$('wake').getAttribute('aria-pressed')!=='true';$('wake').setAttribute('aria-pressed',o);try{await fetch('/api/wake',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:o})})}catch(err){console.error('Wake error:',err)}};
inp.oninput=()=>{$('form').dataset.r=inp.value.trim()?1:0};

try{await fetch('/api/prompt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t,effort:EFF[ei][0]})})}catch(err){console.error('Prompt error:',err)}};
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea,select'))return;if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key.toLowerCase();
if(e.code==='Space'){e.preventDefault();if(!e.repeat&&!pttHeld){pttHeld=true;if(demoOn)demo(false);clear();mic(true);setState('listening');fetch('/api/talk/start',{method:'POST'}).catch(()=>{});emit({event:'ptt',on:true})}}
else if(k==='f')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});
else if(k==='m')mic(!micOn);else if(k==='d')demo(!demoOn);else if('1234'.includes(k)&&k){if(demoOn)demo(false);setState(['idle','listening','thinking','speaking']['1234'.indexOf(k)])}});
addEventListener('keyup',e=>{if(e.code==='Space'&&pttHeld){pttHeld=false;mic(false);setState('thinking');fetch('/api/talk/stop',{method:'POST'}).catch(()=>{});emit({event:'ptt',on:false})}});
$('mic').onclick=()=>{if(demoOn)demo(false);if(!micOn){clear();mic(true);setState('listening');fetch('/api/talk/start',{method:'POST'}).catch(()=>{})}else{mic(false);setState('thinking');fetch('/api/talk/stop',{method:'POST'}).catch(()=>{})}};

function switchToOrb(){
  if(demoOn)demo(false);
  const start=performance.now(),dur=400,origR=R;
  function implode(now){
    const p=Math.min(1,(now-start)/dur);
    R=origR*(1-p);
    bE=Math.max(0,1-p);
    if(p<1){
      requestAnimationFrame(implode);
    }else{
      fetch('/api/switch-to-orb',{method:'POST'}).catch(()=>{});
      try{window.close()}catch(e){}
      setTimeout(()=>{
        document.body.innerHTML='<div style="display:grid;place-items:center;height:100vh;background:#020609;color:#34d399;font-family:sans-serif;font-size:15px;letter-spacing:0.25em;text-transform:uppercase;">GIDEON ORB ACTIVE ON DESKTOP<br><span style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:14px;letter-spacing:0.15em;">You can safely close this tab</span></div>';
      },120);
    }
  }
  requestAnimationFrame(implode);
}
if($('to-orb')) $('to-orb').onclick=switchToOrb;

let coreHoldTimer=null;
cv.addEventListener('pointerdown',e=>{
  const dx=e.clientX-cx,dy=e.clientY-cy;
  if(Math.sqrt(dx*dx+dy*dy)<R*1.4){
    coreHoldTimer=setTimeout(()=>{
      switchToOrb();
    },550);
  }
});
cv.addEventListener('pointerup',()=>{if(coreHoldTimer){clearTimeout(coreHoldTimer);coreHoldTimer=null;}});
cv.addEventListener('pointercancel',()=>{if(coreHoldTimer){clearTimeout(coreHoldTimer);coreHoldTimer=null;}});

addEventListener('dblclick',e=>{if(e.target===cv)document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})});

if(P.get('demo')==='1')setTimeout(()=>{if(!bridge)demo(true)},1200);
emit({event:'ready',name:'GIDEON PRIME'});
